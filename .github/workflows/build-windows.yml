name: Build Blender 5.2.1 + DLSS5 (v3 SVN 自动探测)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: ['port.patch', '.github/workflows/build-windows.yml']

env:
  SRC_DIR: blender-src
  CACHE_KEY: v1

jobs:
  build_windows:
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      SVN_MARK: C:\svn-marker

    steps:
      # --------------------------------------------------------
      # 1. 拉你的仓库(含根目录 port.patch)
      # --------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # --------------------------------------------------------
      # 2. 取官方纯 v5.2.1 源码
      # --------------------------------------------------------
      - uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: v5.2.1
          path: ${{ env.SRC_DIR }}
          fetch-depth: 1

      # --------------------------------------------------------
      # 3. 打 DLSS5 补丁(已验证:8改+3新=11项)
      # --------------------------------------------------------
      - name: Apply DLSS5 patch
        shell: cmd
        working-directory: ${{ env.SRC_DIR }}
        run: |
          if not exist "%GITHUB_WORKSPACE%\port.patch" ( echo ERROR: no port.patch at repo root & exit /b 1 )
          git apply --check "%GITHUB_WORKSPACE%\port.patch"
          if errorlevel 1 ( echo PATCH CHECK FAILED & exit /b 1 )
          git apply "%GITHUB_WORKSPACE%\port.patch"
          echo PATCH-OK

      # --------------------------------------------------------
      # 4. 装 SVN + 自动探测路径(兼容 SlikSvn/Subversion 两种)
      #  首次把 svn.exe 所在目录写进 GITHUB_PATH,后续步骤直接用
      # --------------------------------------------------------
      - name: Install SVN and probe its path
        shell: powershell
        run: |
          choco install svn -y --no-progress
          $cands = @(
            "C:\Program Files\SlikSvn\bin\svn.exe",
            "C:\Program Files\Subversion\bin\svn.exe",
            "$env:ChocolateyInstall\bin\svn.exe"
          )
          $found = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            $found = (Get-ChildItem "C:\Program Files" -Recurse -Filter svn.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $found) { Write-Error "SVN not found"; exit 1 }
          $svnDir = Split-Path $found
          echo "$svnDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "SVN dir added to PATH: $svnDir"

      # --------------------------------------------------------
      # 5. 拉依赖库(make.bat update:官方脚本,自动 git+SVN)
      #    首次约 5~9GB,云缓存复用
      # --------------------------------------------------------
      - name: Fetch dependency libraries
        shell: powershell
        working-directory: ${{ env.SRC_DIR }}
        run: |
          cmd /c "call make.bat update"

      # --------------------------------------------------------
      # 6. 全量编译(Release)
      # --------------------------------------------------------
      - name: Build Blender (Release)
        shell: powershell
        working-directory: ${{ env.SRC_DIR }}
        run: |
          cmd /c "call make.bat"

      # --------------------------------------------------------
      # 7. 打包 Blender exe 目录 → zip
      # --------------------------------------------------------
      - name: Package Blender exe directory
        shell: powershell
        run: |
          $bin = Join-Path $env:GITHUB_WORKSPACE "${{ env.SRC_DIR }}\build_windows\bin"
          if (-not (Test-Path $bin)) { Write-Error "build_windows\bin not found"; exit 1 }
          Compress-Archive -Path (Join-Path $bin "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "DLSS5-exe.zip") -Force

      # --------------------------------------------------------
      # 8. 上传产物(Actions 页底部 Artifacts 下载)
      # --------------------------------------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: DLSS5-exe
          path: DLSS5-exe.zip
          if-no-files-found: error
          retention-days: 7
